
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost Dimension</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: radial-gradient(circle at 50% 40%,
                #263c78, #10152e 55%, #080b19);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            padding: 25px;
        }

        .container {
            max-width: 850px;
            position: relative;
            z-index: 2;
        }

        .portal {
            width: 230px;
            height: 230px;
            margin: 0 auto 35px;
            border-radius: 50%;
            background: radial-gradient(circle,
                #111c42 30%, #7957ff 55%,
                #22d3ee 65%, transparent 72%);
            box-shadow: 0 0 45px #7957ff,
                        0 0 100px #22d3ee;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 4s ease-in-out infinite;
        }

        .robot {
            font-size: 95px;
            filter: drop-shadow(0 0 15px #22d3ee);
        }

        .number {
            font-size: clamp(100px, 20vw, 190px);
            font-weight: 900;
            letter-spacing: 12px;
            line-height: 1;
            background: linear-gradient(135deg,
                #ffffff, #22d3ee, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 45px #7957ff55;
        }

        h1 {
            font-size: clamp(24px, 4vw, 38px);
            margin: 25px 0 15px;
            letter-spacing: 2px;
        }

        .description {
            color: #b9c5e8;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .french {
            color: #22d3ee;
            font-size: 14px;
            font-style: italic;
            margin-bottom: 30px;
        }

        .home-button {
            display: inline-block;
            padding: 16px 35px;
            border-radius: 40px;
            background: linear-gradient(90deg,
                #7957ff, #22a9ed);
            color: white;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 0 25px #7957ff66;
        }

        .home-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 40px #22d3ee99;
        }

        .footer {
            margin-top: 45px;
            color: #7381a8;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 10px #22d3ee;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes twinkle {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .portal {
                width: 170px;
                height: 170px;
            }

            .robot {
                font-size: 70px;
            }

            .description {
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="star" style="top:10%;left:15%"></div>
    <div class="star" style="top:25%;left:85%"></div>
    <div class="star" style="top:75%;left:10%"></div>
    <div class="star" style="top:80%;left:90%"></div>
    <div class="star" style="top:45%;left:5%"></div>
    <div class="star" style="top:15%;left:65%"></div>

    <main class="container">

        <div class="portal">
            <div class="robot">🤖</div>
        </div>

        <div class="number">404</div>

        <h1>OOPS! YOU'VE ENTERED THE UNKNOWN.</h1>

        <p class="description">
            Even our smartest systems couldn't find this page.
            Our little robot is still searching the galaxy!
        </p>

        <p class="french">
            Ceci n'est pas une page
        </p>

        <a href="/" class="home-button">
            TAKE ME HOME &rarr;
        </a>

        <div class="footer">
            LOST IN THE DIGITAL UNIVERSE · ERROR 404
        </div>

    </main>

</body>
</html>
